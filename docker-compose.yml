services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      CHROMA_PATH: /app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db
      - ./app/data:/app/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  chroma_data: